version: '3.9'

services:

  nginx1:
    image: nginx
    container_name: nginx1
    ports:
      - "8081:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html

  nginx2:
    image: nginx
    container_name: nginx2
    ports:
      - "8082:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html

  apache:
    image: httpd
    container_name: apache
    ports:
      - "8083:80"
    volumes:
      - ./index.html:/usr/local/apache2/htdocs/index.html